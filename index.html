<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>DSIF (Mobile Web Form)</title>
<link href="style.css?v=4.11.26.1" rel="stylesheet"/>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
</head>
<body>
<header class="topbar">
<div class="topbar-left">
<button class="btn" data-action="reset" type="button">Clear Form</button>
<button class="btn primary" data-action="save" type="button">Print / Save PDF</button>
</div>
<div class="topbar-right">DSIF</div>
</header>
<main class="container">
<section class="card" id="headerCard">
<div class="card-title">Header</div>
<div class="row">
<label class="label" for="projectSelect">Project</label>
<select class="input" id="projectSelect"></select>
</div>
<div class="row hidden" id="projectCustomRow">
<label class="label" for="projectCustom">Custom Project</label>
<input class="input" id="projectCustom" placeholder="Enter project name" type="text"/>
</div>
<div class="row">
<label class="label" for="reportDate">Report Date</label>
<input class="input" id="reportDate" type="date"/>
</div>
<div class="row">
<label class="label" for="daySelect">Day</label>
<select class="input" id="daySelect"></select>
</div><div class="row">
<label class="label" for="shiftSelect">Shift</label>
<select class="input" id="shiftSelect"></select>
</div>
<div class="row">
<label class="label" for="weatherSelect">Weather</label>
<select class="input" id="weatherSelect"></select>
</div>
<div class="row hidden" id="weatherCustomRow">
<label class="label" for="weatherCustom">Custom Weather</label>
<input class="input" id="weatherCustom" placeholder="Enter weather" type="text"/>
</div>
<div class="divider"></div>
<div class="card-subtitle">Attached Pages</div>
<div id="attachedPages"></div>
</section>
<div id="categories"></div>
<section class="card" id="visibleEmissionsCard">
<div class="card-title">
<div>Visible Emissions</div>
<label class="na">
<input id="visibleNA" type="checkbox"/>
<span>N/A</span>
</label>
</div>
<div class="grid4">
<div class="grid4-head">Locations</div>
<div class="grid4-head">Time</div>
<div class="grid4-head">Observation Period</div>
<div class="grid4-head">Emission Time</div>
<input class="input" id="ve_r0_location" placeholder="Row 1"/>
<input class="input" id="ve_r0_time" placeholder="Row 1"/>
<input class="input" id="ve_r0_obs" placeholder="Row 1"/>
<input class="input" id="ve_r0_em" placeholder="Row 1"/>
<input class="input" id="ve_r1_location" placeholder="Row 2"/>
<input class="input" id="ve_r1_time" placeholder="Row 2"/>
<input class="input" id="ve_r1_obs" placeholder="Row 2"/>
<input class="input" id="ve_r1_em" placeholder="Row 2"/>
</div>
</section>
<section class="card" id="commentsCard">
<div class="card-title">Comments / Corrections</div>
<textarea class="input textarea" id="commentsCorrections" placeholder="Enter any comments/corrections" rows="4"></textarea>
</section>
<section class="card" id="signatureCard">
<div class="card-title">Competent Person</div>
<div class="row">
<label class="label" for="printName">Print Name</label>
<input class="input" id="printName" placeholder="Printed name" type="text"/>
</div>
<div class="row">
<div class="label">Signature</div>
<div class="sig-controls">
<button class="btn" id="btnSign" type="button">Sign</button>
<button class="btn" id="btnClearSig" type="button">Clear Signature</button>
</div>
</div>
<div class="sig-preview-wrap">
<img alt="Signature preview" class="sig-preview hidden" id="sigPreview"/>
<div class="hint" id="sigEmpty">No signature captured.</div>
</div>
</section>
<section class="card" style="margin-bottom:80px">
<div class="hint">
        Photos: attach a photo on any question row. Photos will be appended to the end of the saved PDF (4 per page).
      </div>
</section>
</main>
<footer class="bottombar">
<button class="btn" data-action="reset" type="button">Clear Form</button>
<button class="btn primary" data-action="save" type="button">Print / Save PDF</button>
</footer>
<!-- Signature Modal -->
<div aria-modal="true" class="modal hidden" id="sigModal" role="dialog">
<div class="modal-card">
<div class="modal-title">Signature</div>
<canvas class="sig-canvas" id="sigCanvas"></canvas>
<div class="modal-actions">
<button class="btn" id="sigClear" type="button">Clear</button>
<button class="btn" id="sigCancel" type="button">Cancel</button>
<button class="btn primary" id="sigSave" type="button">Save</button>
</div>
</div>
</div>
<script src="app.js?v=4.11.26.1"></script>
</body>
</html>
